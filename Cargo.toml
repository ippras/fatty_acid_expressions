[package]
name = "fatty_acid_expressions"
version = "0.2.0"
authors = ["Giorgi Vladimirovich Kazakov", "Roman Alexandrovich Sidorov"]
edition = "2024"

[dependencies]
const_format = "0.2.36"

egui = { version = "0.34.3", default-features = false, optional = true }
egui-phosphor = { version = "0.12.0", optional = true }
egui_l10n = { git = "https://github.com/ippras/egui_l10n", branch = "0.6", features = [
    "macros",
] }
serde = { version = "1.0.228", features = ["derive", "std"], optional = true }
typed-builder = { version = "0.23.2", optional = true }
widgets = { git = "https://github.com/ippras/widgets", branch = "0.52", features = [
    "polars",
], optional = true }


[features]
default = ["egui", "en", "ru"]
egui = ["dep:egui", "dep:egui-phosphor", "dep:typed-builder", "dep:widgets"]
en = []
ru = []
